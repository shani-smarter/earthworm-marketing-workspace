<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="https://p.trellocdn.com/power-up.min.js"></script><style>body{font:14px system-ui,sans-serif;color:#172b4d;background:#f5f6f8;margin:0;padding:24px}header{display:flex;gap:12px;flex-wrap:wrap;align-items:center}h1{font-size:24px;margin-right:auto}input,select{padding:9px;border:1px solid #b8c0cc;border-radius:6px;background:white}h2{font-size:13px;text-transform:uppercase;color:#526079;margin:24px 0 8px}.project{background:white;border:1px solid #dfe3e9;border-radius:8px;padding:14px;margin-bottom:8px}.line{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.name{font-weight:650;flex:1;min-width:180px}a{color:#0759a8}.meta{color:#526079;font-size:12px}.notes{white-space:pre-wrap;margin-top:8px;color:#526079;font-size:13px}</style></head><body><header><h1>Marketing Workspace</h1><input id="search" placeholder="Search projects"><select id="category"><option value="">All categories</option></select><select id="person"><option value="">All people</option></select></header><p id="status" role="status">Version 4 · Connecting to Trello…</p><main id="projects"></main><script>
const t=window.TrelloPowerUp ? TrelloPowerUp.iframe() : null;const $=id=>document.getElementById(id);let cards=[],lists=[],members=[];function el(tag,text,cls){const n=document.createElement(tag);if(text)n.textContent=text;if(cls)n.className=cls;return n}function options(id,items){for(const x of items){const o=el('option',x.name||x.fullName);o.value=x.id;$(id).append(o)}}function render(){const root=$('projects');root.replaceChildren();let count=0;for(const list of lists){if($('category').value&&$('category').value!==list.id)continue;const group=cards.filter(c=>c.idList===list.id&&!c.closed&&!c.dueComplete&&(!$('person').value||(c.idMembers||[]).includes($('person').value))&&c.name.toLowerCase().includes($('search').value.toLowerCase()));if(!group.length)continue;root.append(el('h2',list.name));for(const c of group){count++;const p=el('article','','project'),line=el('div','','line');const a=el('a',c.name,'name');a.href=c.url||c.shortUrl;a.target='_blank';a.rel='noopener noreferrer';line.append(a);line.append(el('span',(c.idMembers||[]).map(id=>members.find(m=>m.id===id)?.fullName||'').filter(Boolean).join(', ')||'Unassigned','meta'));line.append(el('span',c.due?'Due '+new Date(c.due).toLocaleDateString():'No deadline','meta'));p.append(line);if(c.desc)p.append(el('div',c.desc,'notes'));root.append(p)}}$('status').textContent=count+' active projects · Read-only preview'}function timeout(p,label){return Promise.race([p,new Promise((_,reject)=>setTimeout(()=>reject(new Error(label+' timed out')),12000))])}async function load(){let step='SDK';try{if(!t)throw new Error('Trello SDK unavailable');if(window.parent===window)throw new Error('Open using the Marketing Workspace button inside Trello');step='Read lists';$('status').textContent='Version 4 · '+step;lists=await timeout(t.lists('id','name'),step);step='Read cards';$('status').textContent='Version 4 · '+step;cards=await timeout(t.cards('id','name','idList','due','dueComplete','desc','url','idMembers'),step);step='Read members';try{members=await timeout(t.board('members').then(b=>b.members||[]),step)}catch(e){members=[]}lists=lists.filter(l=>!l.closed);options('category',lists);options('person',members);render();$('status').textContent+=' · Version 4'}catch(e){$('status').textContent='Version 4 · '+step+' failed: '+(e.message||String(e));}}for(const id of ['search','category','person'])$(id).addEventListener('input',render);load();</script></body></html>
